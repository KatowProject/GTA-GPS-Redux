name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: cmake -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Release/SA.GPS.REDUX.asi", "SA.GPS.CONF.ini", "README.md" -DestinationPath "build/Release/GTA-GPS-Redux.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTA-GPS-Redux-${{ github.ref_name }}
          path: |
            build/Release/GTA-GPS-Redux.zip
            build/Release/SA.GPS.REDUX.asi
            SA.GPS.CONF.ini

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            build/Release/GTA-GPS-Redux.zip
            build/Release/SA.GPS.REDUX.asi
            SA.GPS.CONF.ini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
