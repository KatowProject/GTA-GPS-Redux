; This applies to all GPS routes
[Navigation]

; Whether to respect the direction of traffic when calculating the navigation route. 0 (false) or 1 (true)
respectTrafficLaneDirection = 1

; The width of the drawn route.
lineWidth = 2.5

; Whether to draw a dark outline/border around the route for high contrast and modern GTA V look. 0 (false) or 1 (true)
enableOutline = 1

; Outline thickness added to the route width.
outlineWidth = 1.8

; Whether to enable GPS navigation while on foot (walking/running). 0 (false) or 1 (true)
enableOnFoot = 1

; Whether to enable GPS on bicycles. 0 (false) or 1 (true)
enableOnBicycles = 0

; Same idea, just on boats. 0 (false) or 1 (true)
enableOnBoats = 1

; GTA V does not provide GPS routes for moving
; targets like cars and peds. If you'd like to
; enable navigation for these objects set this to "1". 0 (false) or 1 (true)
trackMovingTargets = 0

; This value sets how close you have to be before the
; navigation line stops showing (in meters). Also automatically
; removes waypoint. 
removeRadius = 40.0

[Extras]
; Whether to display how far you are from your target above & below the radar. 0 (false) or 1 (true)
displayDistance = 1

; The units used for the distance. 0 = Normal (KM/m), 1 = Freedom Units (Mi/yrds)
distanceUnits = 0

; Whether to display Estimated Time of Arrival (ETA) next to distance. 0 (false) or 1 (true)
displayETA = 1

; Whether to enable the animated/flowing GPS line effect. The line pulses toward your destination. 0 (false) or 1 (true)
animatedLine = 1

; Speed of the line animation. Higher = faster pulse. Default: 3.0
animationSpeed = 3.0

; Whether to show directional arrows at sharp turns on the GPS route. 0 (false) or 1 (true)
turnArrows = 1

; Size of the turn arrow indicators. Default: 3.5
arrowSize = 3.5

; Minimum angle (degrees) for a turn to show an arrow. Lower = more arrows. Default: 40.0
turnAngleThreshold = 40.0

; Whether to display upcoming turn direction and distance below the radar. 0 (false) or 1 (true)
nextTurnDisplay = 1

; Whether to automatically detect when you go off-route, display "REROUTING..." and recalculate path. 0 (false) or 1 (true)
rerouteOnDeviate = 1

; Distance (in meters) away from the route before off-route rerouting triggers. Default: 45.0
offRouteDistance = 45.0

; Master toggle for GPS audio sound cues. 0 (false) or 1 (true)
audioCues = 1

; Audio cue (chime) when approaching a sharp turn. 0 (false) or 1 (true)
audioTurnAlert = 1

; Audio cue (fanfare) when you arrive at your destination. 0 (false) or 1 (true)
audioArrived = 1

; Audio cue when off-route rerouting is triggered. 0 (false) or 1 (true)
audioReroute = 1

; These settings allow you to set custom colors
; for the various navigation paths in missions.
; Each color is represented by RGBA values separated
; by , .
[Custom Colors]

; Enables/disables custom colors. 0 (false) or 1 (true)
enabled = 0

; Outline color (RGBA)
outline = 0, 0, 0, 255

; For the waypoint route.
waypoint = 180, 24, 24, 255

; Usually used for enemies.
red = 255, 0 , 0, 255

; Usually used for pickups and other things.
green = 0, 255, 0, 255

; Usually used for friendly targets.
blue = 0, 0, 255, 255

; Not really used as far as I've seen.
white = 255, 255, 255, 255

; Usually used for destinations.
yellow = 255, 255, 0, 255

; These two aren't really used either.
purple = 255, 0, 255, 255
cyan = 0, 255, 255, 255

; Do not touch this unless you know what you're doing.
[Misc]
enableLog = 0